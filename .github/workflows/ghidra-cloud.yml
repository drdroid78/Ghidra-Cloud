name: Ghidra Cloud
run-name: "${{ github.event_name == 'issues' && format('Owner request #{0}', github.event.issue.number) || github.workflow }}"
on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      mode:
        description: Analysis mode
        type: choice
        options: [selftest, analyze, compare, resume]
        default: analyze
      binary_path:
        description: Authorized PUBLIC repository binary, up to 100 MiB
        type: string
      release_tag:
        description: Tag of a GitHub Release containing libstardroid.so
        type: string
        default: ''
      compare_path:
        description: Second PUBLIC binary (compare mode)
        type: string
      function_filter:
        description: Function name or address substring; * = all
        type: string
        default: '*'
      query:
        description: Literal case-insensitive search in decompiled code, strings, scalars, functions and XREFs
        type: string
      max_functions:
        description: Maximum decompilation attempts (1-5000)
        type: string
        default: '200'
      confirm_ghidra_install:
        description: "PERSONAL APPROVAL: allow Ghidra 12.2 installation only if the verified cache is missing/invalid (repository owner only)"
        type: boolean
        default: false
      raw_language:
        description: Ghidra language ID for RAW; blank = automatic loader
        type: string
      raw_base:
        description: RAW load base address (hex)
        type: string
      raw_entry:
        description: RAW entry address (hex)
        type: string
      raw_compiler:
        description: RAW compiler spec ID
        type: string
        default: default
      resume_run:
        description: Successful main-branch run ID containing ghidra-project
        type: string
      resume_label:
        description: Saved project label (a, b, raw, arm32, arm64)
        type: string
        default: a
permissions:
  contents: read
  actions: read
jobs:
  analyze:
    if: github.event_name != 'issues' || (github.event.issue.title == 'Ghidra Cloud request' && github.event.issue.user.id == 62127032 && github.event.sender.id == 62127032 && github.event.issue.author_association == 'OWNER')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      MODE: ${{ inputs.mode || 'selftest' }}
      INPUT_PATH: ${{ inputs.release_tag != '' && 'uploads/libstardroid.so' || inputs.binary_path }}
      RELEASE_TAG: ${{ inputs.release_tag }}
      COMPARE_PATH: ${{ inputs.compare_path }}
      FILTER: ${{ inputs.function_filter || '*' }}
      QUERY: ${{ inputs.query }}
      LIMIT: ${{ inputs.max_functions || '200' }}
      RAW_LANGUAGE: ${{ inputs.raw_language }}
      RAW_BASE: ${{ inputs.raw_base }}
      RAW_ENTRY: ${{ inputs.raw_entry }}
      RAW_COMPILER: ${{ inputs.raw_compiler || 'default' }}
      RESUME_RUN: ${{ inputs.resume_run }}
      RESUME_LABEL: ${{ inputs.resume_label || 'a' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Validate owner request
        id: request
        if: github.event_name == 'issues'
        env:
          REQUEST_KIND: ghidra
        run: python3 toolbox/issue_request.py
      - name: Checkout temporary analysis ref
        if: github.event_name == 'issues' && steps.request.outputs.source_ref != ''
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ steps.request.outputs.source_ref }}
          clean: true
          persist-credentials: false
      - name: Download temporary binary from GitHub Release
        if: inputs.release_tag != '' || steps.request.outputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || steps.request.outputs.release_tag }}
        run: |
          mkdir -p uploads
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern "libstardroid.so" --dir uploads --clobber
          test -s uploads/libstardroid.so
          echo "INPUT_PATH=uploads/libstardroid.so" >> "$GITHUB_ENV"
      - name: Restore verified Ghidra 12.2 cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ runner.temp }}/ghidra-cloud/ghidra_12.2_PUBLIC
          key: ghidra-12.2-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ghidra-12.2-${{ runner.os }}-
      - name: Check cached Ghidra integrity
        id: ghidra-check
        shell: bash
        run: |
          dir="$RUNNER_TEMP/ghidra-cloud/ghidra_12.2_PUBLIC"
          expected="2c2cd776db3c1f6a097ba418922378ac3649cadd5e844a6f5f088ae628a7be67"
          if [[ -x "$dir/support/analyzeHeadless" && -f "$dir/.ghidra-cloud-verified" && "$(cat "$dir/.ghidra-cloud-verified")" == "$expected" ]]; then
            echo "valid=true" >> "$GITHUB_OUTPUT"
          else
            echo "valid=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Block Ghidra installation without Pavel's approval
        if: ${{ steps.ghidra-check.outputs.valid != 'true' && !(github.event_name == 'workflow_dispatch' && github.actor_id == '62127032' && inputs.confirm_ghidra_install == true) }}
        run: |
          echo "::error::Ghidra cache is missing or invalid. Installation is blocked. Only drdroid78 can approve it with confirm_ghidra_install=true in workflow_dispatch."
          exit 1
      - name: Prepare Java runtime for cached Ghidra
        if: ${{ steps.ghidra-check.outputs.valid == 'true' }}
        run: bash scripts/prepare-java.sh
      - name: Install Ghidra (explicit owner approval only)
        id: install-ghidra
        if: ${{ steps.ghidra-check.outputs.valid != 'true' && github.event_name == 'workflow_dispatch' && github.actor_id == '62127032' && inputs.confirm_ghidra_install == true }}
        env:
          GHIDRA_APPROVAL_EVENT: ${{ github.event_name }}
          GHIDRA_APPROVED_BY_ID: ${{ github.actor_id }}
          GHIDRA_INSTALL_APPROVAL: ${{ github.event_name == 'workflow_dispatch' && github.actor_id == '62127032' && inputs.confirm_ghidra_install == true && 'PAVEL_CONFIRMED_GHIDRA_12_2_INSTALL' || '' }}
        run: bash scripts/install.sh
      - name: Verify protected Ghidra installation
        id: verify-ghidra
        shell: bash
        run: |
          dir="$RUNNER_TEMP/ghidra-cloud/ghidra_12.2_PUBLIC"
          test -x "$dir/support/analyzeHeadless"
          test "$(cat "$dir/.ghidra-cloud-verified")" = "2c2cd776db3c1f6a097ba418922378ac3649cadd5e844a6f5f088ae628a7be67"
      - name: Save approved Ghidra cache
        if: ${{ steps.install-ghidra.outcome == 'success' && steps.verify-ghidra.outcome == 'success' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ runner.temp }}/ghidra-cloud/ghidra_12.2_PUBLIC
          key: ghidra-12.2-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Run static analysis and verification
        env:
          GH_TOKEN: ${{ (inputs.mode == 'resume' || steps.request.outputs.mode == 'resume') && github.token || '' }}
        run: python3 -u scripts/cloud.py
      - name: Save public evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ghidra-report
          path: ${{ runner.temp }}/ghidra-cloud/report/
          retention-days: 14
          if-no-files-found: ignore
      - name: Save reusable public project
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ghidra-project
          path: ${{ runner.temp }}/ghidra-cloud/ghidra-project.tar.gz
          retention-days: 14
          if-no-files-found: error
  verify-persistence:
    if: inputs.mode == 'selftest'
    needs: analyze
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Restore verified Ghidra 12.2 cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ runner.temp }}/ghidra-cloud/ghidra_12.2_PUBLIC
          key: ghidra-12.2-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ghidra-12.2-${{ runner.os }}-
      - name: Check cached Ghidra integrity
        id: ghidra-check
        shell: bash
        run: |
          dir="$RUNNER_TEMP/ghidra-cloud/ghidra_12.2_PUBLIC"
          expected="2c2cd776db3c1f6a097ba418922378ac3649cadd5e844a6f5f088ae628a7be67"
          if [[ -x "$dir/support/analyzeHeadless" && -f "$dir/.ghidra-cloud-verified" && "$(cat "$dir/.ghidra-cloud-verified")" == "$expected" ]]; then
            echo "valid=true" >> "$GITHUB_OUTPUT"
          else
            echo "valid=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Block Ghidra installation without Pavel's approval
        if: ${{ steps.ghidra-check.outputs.valid != 'true' && !(github.event_name == 'workflow_dispatch' && github.actor_id == '62127032' && inputs.confirm_ghidra_install == true) }}
        run: |
          echo "::error::Ghidra cache is missing or invalid. Installation is blocked. Only drdroid78 can approve it with confirm_ghidra_install=true in workflow_dispatch."
          exit 1
      - name: Prepare Java runtime for cached Ghidra
        if: ${{ steps.ghidra-check.outputs.valid == 'true' }}
        run: bash scripts/prepare-java.sh
      - name: Install Ghidra (explicit owner approval only)
        id: install-ghidra
        if: ${{ steps.ghidra-check.outputs.valid != 'true' && github.event_name == 'workflow_dispatch' && github.actor_id == '62127032' && inputs.confirm_ghidra_install == true }}
        env:
          GHIDRA_APPROVAL_EVENT: ${{ github.event_name }}
          GHIDRA_APPROVED_BY_ID: ${{ github.actor_id }}
          GHIDRA_INSTALL_APPROVAL: ${{ github.event_name == 'workflow_dispatch' && github.actor_id == '62127032' && inputs.confirm_ghidra_install == true && 'PAVEL_CONFIRMED_GHIDRA_12_2_INSTALL' || '' }}
        run: bash scripts/install.sh
      - name: Verify protected Ghidra installation
        id: verify-ghidra
        shell: bash
        run: |
          dir="$RUNNER_TEMP/ghidra-cloud/ghidra_12.2_PUBLIC"
          test -x "$dir/support/analyzeHeadless"
          test "$(cat "$dir/.ghidra-cloud-verified")" = "2c2cd776db3c1f6a097ba418922378ac3649cadd5e844a6f5f088ae628a7be67"
      - name: Save approved Ghidra cache
        if: ${{ steps.install-ghidra.outcome == 'success' && steps.verify-ghidra.outcome == 'success' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ runner.temp }}/ghidra-cloud/ghidra_12.2_PUBLIC
          key: ghidra-12.2-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Restore project from artifact and repeat query
        env:
          MODE: resume_test
          RESUME_RUN: ${{ github.run_id }}
          RESUME_LABEL: a
          QUERY: '0x12345678'
          LIMIT: '200'
          GH_TOKEN: ${{ github.token }}
        run: python3 -u scripts/cloud.py
      - name: Save restoration evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ghidra-resume-proof
          path: ${{ runner.temp }}/ghidra-cloud/report/
          retention-days: 14
          if-no-files-found: ignore
